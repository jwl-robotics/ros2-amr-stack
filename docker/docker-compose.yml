services:
  amr:
    container_name: ros2-amr
    build:
      context: ../.
      dockerfile: docker/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../src:/ros2_ws/src
      - ../test:/ros2_ws/test
      - ../scripts:/ros2_ws/scripts
      - ../maps:/ros2_ws/maps
      - ../models:/ros2_ws/models
    stdin_open: true
    tty: true
    command: bash
    env_file:
      - ../.env
