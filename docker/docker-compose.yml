version: "3.8"

services:
  amr:
    build:
      context: ../.
      dockerfile: docker/Dockerfile
    runtime: nvidia
    environment:
      - DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../src:/ros2_ws/src
      - ../maps:/ros2_ws/maps
      - ../models:/ros2_ws/models
    stdin_open: true
    tty: true
    command: bash
    env_file:
      - ../.env
